<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#32a791">
  <title data-i18n="documentTitle">Trybewarts admission form</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="project-bar.css">
</head>
<body>
  <header class="header">
    <a class="brand" href="./">
      <img class="trybewarts-header-logo" src="images/trybewarts-header-logo.svg" alt="">
      <span id="trybewarts-header-title">Trybewarts</span>
    </a>

    <form class="trybewarts-login" novalidate>
      <input type="email" name="email" id="email-login" autocomplete="username"
        data-i18n-placeholder="login.email" data-i18n-aria="login.email" placeholder="Email">
      <input type="password" name="password" id="password-login" autocomplete="current-password"
        data-i18n-placeholder="login.password" data-i18n-aria="login.password" placeholder="Password">
      <button type="submit" id="button-login" data-i18n="login.submit">Sign in</button>
      <p class="login-status" id="login-status" role="status"></p>
    </form>
  </header>

  <main class="page">
    <div class="intro">
      <h1 data-i18n="intro.title">Apply to Trybewarts</h1>
      <p data-i18n="intro.text">Tell us who you are, pick your house and choose what you want to learn first.</p>
    </div>

    <form id="evaluation-form" class="letter" novalidate>
      <fieldset class="section">
        <legend data-i18n="about.title">About you</legend>
        <div class="grid-2">
          <label class="field">
            <span data-i18n="about.firstName">First name</span>
            <input type="text" id="input-name" name="firstName" autocomplete="given-name">
          </label>
          <label class="field">
            <span data-i18n="about.lastName">Last name</span>
            <input type="text" id="input-lastname" name="lastName" autocomplete="family-name">
          </label>
          <label class="field span-2">
            <span data-i18n="about.email">Email</span>
            <input type="email" id="input-email" name="email" autocomplete="email">
          </label>
        </div>
      </fieldset>

      <fieldset class="section">
        <legend data-i18n="house.title">Your house</legend>
        <div class="houses">
          <label class="house house-git">
            <input type="radio" name="house" value="Gitnória" checked>
            <span class="house-name">Gitnória</span>
          </label>
          <label class="house house-react">
            <input type="radio" name="house" value="Reactpuff">
            <span class="house-name">Reactpuff</span>
          </label>
          <label class="house house-node">
            <input type="radio" name="house" value="Corvinode">
            <span class="house-name">Corvinode</span>
          </label>
          <label class="house house-python">
            <input type="radio" name="house" value="Pytherina">
            <span class="house-name">Pytherina</span>
          </label>
        </div>
      </fieldset>

      <fieldset class="section">
        <legend data-i18n="family.title">Your family</legend>
        <div class="chips">
          <label class="chip"><input type="radio" name="family" value="Frontend"><span>Frontend</span></label>
          <label class="chip"><input type="radio" name="family" value="Backend"><span>Backend</span></label>
          <label class="chip"><input type="radio" name="family" value="FullStack"><span>Full stack</span></label>
        </div>
      </fieldset>

      <fieldset class="section">
        <legend data-i18n="subjects.title">What do you most want to learn?</legend>
        <div class="chips">
          <label class="chip"><input type="checkbox" class="subject" value="HoFs"><span>HoFs</span></label>
          <label class="chip"><input type="checkbox" class="subject" value="Jest"><span>Jest</span></label>
          <label class="chip"><input type="checkbox" class="subject" value="Promises"><span>Promises</span></label>
          <label class="chip"><input type="checkbox" class="subject" value="React"><span>React</span></label>
          <label class="chip"><input type="checkbox" class="subject" value="SQL"><span>SQL</span></label>
          <label class="chip"><input type="checkbox" class="subject" value="Python"><span>Python</span></label>
        </div>
      </fieldset>

      <fieldset class="section">
        <legend data-i18n="rate.title">How would you rate Trybewarts?</legend>
        <div class="rating" id="rating"></div>
      </fieldset>

      <fieldset class="section">
        <legend data-i18n="comments.title">Comments</legend>
        <label class="field">
          <span class="visually-hidden" data-i18n="comments.title">Comments</span>
          <textarea id="textarea" rows="5" maxlength="500" aria-describedby="counter"
            data-i18n-placeholder="comments.placeholder"></textarea>
        </label>
        <p class="counter" id="counter" aria-live="polite"></p>
      </fieldset>

      <div class="submit-row">
        <label class="agreement">
          <input type="checkbox" id="agreement">
          <span data-i18n="agreement">I agree to the use of the information above.</span>
        </label>
        <button type="submit" id="submit-btn" disabled data-i18n="submit">Send application</button>
      </div>
    </form>

    <aside class="crest">
      <img src="images/trybewarts-colored.svg" alt="" id="trybewarts-forms-logo">
    </aside>
  </main>

  <footer class="footer">
    <p data-i18n="footer">Trybewarts, all rights reserved.</p>
  </footer>

  <nav class="project-bar" data-i18n-aria="projectBar.label" aria-label="Trybe projects">
    <a class="project-bar-home" href="../" data-i18n="projectBar.all">All projects</a>
    <div class="project-bar-langs" role="group" data-i18n-aria="projectBar.language" aria-label="Language">
      <button type="button" lang="en" title="English" data-lang="en">EN</button>
      <button type="button" lang="pt" title="Português" data-lang="pt">PT</button>
    </div>
  </nav>

  <script src="script.js"></script>
</body>
</html>
